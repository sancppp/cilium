# nginx-deployment-service.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: default  # 可根据需要修改命名空间
  labels:
    app: nginx
spec:
  replicas: 2  # 副本数，根据业务调整
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: m.daocloud.io/docker.io/library/nginx:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        # 存活探针：检测容器是否正常运行，异常则重启
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10  # 容器启动后10秒开始检测
          periodSeconds: 10        # 每10秒检测一次
          timeoutSeconds: 5        # 检测超时时间5秒
        # 就绪探针：检测容器是否可提供服务，未就绪则不转发流量
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
---
# Service：暴露Nginx服务，NodePort方式便于外部访问
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: default
spec:
  selector:
    app: nginx
  type: NodePort  # 测试环境用NodePort，生产环境可改用LoadBalancer/Ingress
  ports:
  - port: 80        # Service端口
    targetPort: 80  # 容器端口
    nodePort: 30080 # 节点端口（范围30000-32767，可自定义）